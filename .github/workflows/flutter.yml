name: Flutter CRM
on:
  push:
  pull_request:
jobs:
  flutter:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: flowza_frontend_test
          POSTGRES_USER: flowza_test
          POSTGRES_PASSWORD: integration-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U flowza_test -d flowza_frontend_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      CI: 'true'
      FLUTTER_SUPPRESS_ANALYTICS: 'true'
      FLOWZA_SMOKE_DATABASE_URL: postgres://flowza_test:integration-only@localhost:5432/flowza_frontend_test
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.6'
          channel: stable
          cache: true
      - run: python -m pip install -r ../requirements.txt
      - run: flutter pub get
      - run: dart run build_runner build
      - run: flutter analyze
      - run: flutter test
      - run: flutter build web --release --no-web-resources-cdn
      - run: python tool/live_smoke.py
