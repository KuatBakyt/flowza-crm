name: Backend checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: flowza
          POSTGRES_PASSWORD: test-only
          POSTGRES_DB: flowza
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U flowza"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DJANGO_SECRET_KEY: ci-test-secret-never-use-in-production-123456789
      DATABASE_URL: postgresql://flowza:test-only@localhost:5432/flowza
      DEBUG: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python manage.py check
      - run: python manage.py migrate --noinput
      - run: python manage.py makemigrations --check --dry-run
      - run: python manage.py spectacular --file schema.yaml --validate --fail-on-warn
      - run: python -m pytest
